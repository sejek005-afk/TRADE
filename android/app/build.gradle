plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.neurotrader.pro'
    compileSdk 35

    defaultConfig {
        // شناسه‌ی جدا از اپ قبلی (com.neurotrader.app) تا هر دو روی گوشی کنار هم نصب باشند
        applicationId "com.neurotrader.pro"
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        // کلید ثابت تا نسخه‌های جدید روی نسخه‌ی قبلی نصب شوند
        shared {
            storeFile file("ntpro.keystore")
            storePassword "ntpro-release"
            keyAlias "ntpro"
            keyPassword "ntpro-release"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    def bom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation bom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
